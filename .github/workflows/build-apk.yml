name: Build Native Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK (JDK 17)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 (Bundle Web UI into APK Assets)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web Application & Bundle into APK Assets (Zero-Hosting Mode)
        run: |
          npm ci || npm install
          npm run build
          rm -rf android/app/src/main/assets/*
          mkdir -p android/app/src/main/assets
          cp -r dist/index.html dist/assets dist/data-bridge.js android/app/src/main/assets/
          if [ -f dist/google-services.json ]; then cp dist/google-services.json android/app/src/main/assets/; fi
          echo "Clean standalone driver web assets bundled into android/app/src/main/assets/"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Ensure Gradle Wrapper Exists
        working-directory: android
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: Build Debug APK with Gradle
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocateGo-Driver-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Build Release APK (Unsigned)
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Upload Release APK (Unsigned) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocateGo-Driver-Release-Unsigned-APK
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 14
